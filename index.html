<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UFPA em Números - Layout Final</title>

    <link rel="stylesheet" href="css/style.css">

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />

  
  </head>
  <body data-page-title="index.title">
    <div class="language-switcher" aria-label="Idioma" data-i18n-aria-label="language.label">
      <button type="button" class="language-btn flag-br" data-language-option="pt" data-lang="pt" aria-label="Português" title="Português"></button>
      <button type="button" class="language-btn flag-us" data-language-option="en" data-lang="en" aria-label="English" title="English"></button>
    </div>
    <video id="bg-video" autoplay muted loop playsinline>
      <source src="video/fundo.mp4" type="video/mp4" />
      <span data-i18n="index.videoFallback">Seu navegador não suporta vídeos.</span>
    </video>

    <div class="chart-wrapper">
      <h1 class="main-title" data-i18n="index.mainTitle"><span>UFPA</span> em Números</h1>

      <div class="center-content"></div>

      <div id="container"></div>
    </div>

    <script src="https://code.highcharts.com/highcharts.js"></script>
    <script src="scripts/translations.js"></script>
    <script src="scripts/i18n.js"></script>
    <script src="scripts\script.js"></script>
  </body>
</html>
